# Cuts a release: test -> tag -> push -> GitHub release -> verify.
#
# There is no publish step and that is correct: Go has no registry. The proxy
# serves modules straight from the tagged repository, so the tag IS the
# publish.
#
# The verification exists because that is not the same as it being usable. No
# v2 tag of this module was installable between v2.0.0 and v2.2.1 - the module
# path was missing its /v2 suffix, so proxy.golang.org refused every one of
# them. Nothing in-repo could see it: the module resolves from the working tree
# here and its path is never checked against a tag. Only `go get` from outside
# finds that.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 2.4.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # A v2+ module must carry the major version in its path or the proxy
      # refuses the tag outright. Checked here rather than discovered by a
      # consumer.
      - name: Check the module path matches the major version
        run: |
          set -eu
          v="${{ inputs.version }}"
          major="${v%%.*}"
          path=$(go list -m)
          if [ "$major" -ge 2 ] && [ "${path%/v$major}" = "$path" ]; then
            echo "::error::module path is $path but releasing v$major - it must end in /v$major, or the proxy will refuse the tag"
            exit 1
          fi
          echo "module path $path is correct for v$major"

      - name: Tag and push
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes

  verify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go get it from the proxy and use it
        run: |
          set -eu
          v="${{ needs.release.outputs.version }}"
          path=$(echo "github.com/activeledger/SDK-Golang/v${v%%.*}")
          mkdir consumer && cd consumer
          go mod init consumer
          for i in $(seq 1 12); do
            GOPROXY=proxy.golang.org go get "$path@v$v" && break
            echo "proxy has not served it yet (attempt $i)"; sleep 20
          done
          cat > main.go <<EOF
          package main

          import (
              "fmt"
              activeledger "$path"
          )

          func main() {
              // The number formatting is the thing a bad release loses quietly.
              if activeledger.JSNumber(1e-7) != "1e-7" {
                  panic("1e-7")
              }
              if activeledger.JSNumber(1e21) != "1e+21" {
                  panic("1e+21")
              }
              fmt.Println("registry install verified")
          }
          EOF
          go mod tidy && go run .
