name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...
      # A library that only builds on its development Go version breaks for
      # half its consumers.
      - run: go build ./...
      # Builds the SDK the way a dependent project would, from outside the
      # module, so a broken module path or go.sum fails here.
      # The script resolves offline (GOPROXY=off), so fill the module cache first.
      - run: go mod download all
      - run: scripts/smoke.sh
